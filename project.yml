name: Vortex
options:
  bundleIdPrefix: Kaider
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Vortex:
    type: application
    platform: iOS
    sources:
      - path: Vortex
    dependencies:
      - target: VortexTunnelExtension
        embed: true
    settings:
      base:
        PRODUCT_NAME: Vortex
        PRODUCT_BUNDLE_IDENTIFIER: Kaider.Vortex
        CODE_SIGN_ENTITLEMENTS: Vortex/Vortex.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Vortex
        INFOPLIST_KEY_NSCameraUsageDescription: "Используется для сканирования QR-кодов серверов и подписок VPN"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OPTIMIZATION_LEVEL: "-O"

  VortexTunnelExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: VortexTunnelExtension
    dependencies:
      - framework: Frameworks/Libbox.xcframework
        embed: true
    settings:
      base:
        PRODUCT_NAME: VortexTunnelExtension
        PRODUCT_BUNDLE_IDENTIFIER: Kaider.Vortex.tunnel
        CODE_SIGN_ENTITLEMENTS: VortexTunnelExtension/VortexTunnelExtension.entitlements
        INFOPLIST_FILE: VortexTunnelExtension/Info.plist
        WRAPPER_EXTENSION: appex
        SWIFT_OPTIMIZATION_LEVEL: "-O"

  VortexMac:
    type: application
    platform: macOS
    sources:
      - path: Vortex
    dependencies:
      - framework: Frameworks/Libbox.xcframework
        embed: true
    settings:
      base:
        PRODUCT_NAME: Vortex
        PRODUCT_BUNDLE_IDENTIFIER: Kaider.VortexMac
        INFOPLIST_KEY_CFBundleDisplayName: Vortex
        CODE_SIGN_ENTITLEMENTS: Vortex/VortexMac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OPTIMIZATION_LEVEL: "-O"

schemes:
  Vortex:
    build:
      targets:
        Vortex: all
        VortexTunnelExtension: all
    run:
      config: Debug

  VortexMac:
    build:
      targets:
        VortexMac: all
    run:
      config: Debug
